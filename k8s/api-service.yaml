# Internal only; public traffic must go through the ingress (TLS, edge rate limit, real client IP)
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: naqa
  labels:
    io.kompose.service: api
spec:
  type: ClusterIP
  selector:
    io.kompose.service: api
  ports:
    - name: "3000"
      port: 3000
      targetPort: 3000
